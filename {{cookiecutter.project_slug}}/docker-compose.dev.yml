# Docker Compose for development with hot reload
version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: {{ cookiecutter.project_slug }}_app_dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME={{ cookiecutter.project_slug }}_dev
      {%- if cookiecutter.use_redis == "yes" %}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      {%- endif %}
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      - db
      {%- if cookiecutter.use_redis == "yes" %}
      - redis
      {%- endif %}
    networks:
      - {{ cookiecutter.project_slug }}_dev_network

  db:
    image: postgres:15-alpine
    container_name: {{ cookiecutter.project_slug }}_db_dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB={{ cookiecutter.project_slug }}_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - {{ cookiecutter.project_slug }}_dev_network

  {%- if cookiecutter.use_redis == "yes" %}
  redis:
    image: redis:7-alpine
    container_name: {{ cookiecutter.project_slug }}_redis_dev
    ports:
      - "6379:6379"
    networks:
      - {{ cookiecutter.project_slug }}_dev_network
  {%- endif %}

networks:
  {{ cookiecutter.project_slug }}_dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
