{% raw %}{% extends "base.html" %}

{% block title %}注册 - {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                创建新账户
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                已有账户？
                <a href="/login" class="font-medium text-blue-600 hover:text-blue-500">
                    立即登录
                </a>
            </p>
        </div>
        
        <!-- 错误提示 -->
        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative">
            <span id="error-text"></span>
        </div>
        
        <!-- 成功提示 -->
        <div id="success-message" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative">
            <span id="success-text"></span>
        </div>
        
        <form id="register-form" class="mt-8 space-y-6">
            <div class="space-y-4">
                <div>
                    <label for="full_name" class="block text-sm font-medium text-gray-700">姓名</label>
                    <input id="full_name" name="full_name" type="text" autocomplete="name"
                           class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                           placeholder="请输入您的姓名">
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">邮箱地址 <span class="text-red-500">*</span></label>
                    <input id="email" name="email" type="email" autocomplete="email" required
                           class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                           placeholder="example@email.com">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">密码 <span class="text-red-500">*</span></label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"
                           class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                           placeholder="至少8位，包含大小写字母和数字">
                </div>
                
                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700">确认密码 <span class="text-red-500">*</span></label>
                    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required
                           class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                           placeholder="再次输入密码">
                </div>
            </div>

            <div class="flex items-center">
                <input id="agree-terms" name="agree_terms" type="checkbox" required
                       class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                <label for="agree-terms" class="ml-2 block text-sm text-gray-900">
                    我同意
                    <a href="/terms" class="text-blue-600 hover:text-blue-500">服务条款</a>
                    和
                    <a href="/privacy" class="text-blue-600 hover:text-blue-500">隐私政策</a>
                </label>
            </div>

            <div>
                <button type="submit" id="submit-btn"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <svg class="h-5 w-5 text-blue-500 group-hover:text-blue-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M8 9a3 3 0 100-6 3 3 0 000 6zM8 11a6 6 0 016 6H2a6 6 0 016-6zM16 7a1 1 0 10-2 0v1h-1a1 1 0 100 2h1v1a1 1 0 102 0v-1h1a1 1 0 100-2h-1V7z" />
                        </svg>
                    </span>
                    注册
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('register-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submit-btn');
    const errorMessage = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    const successMessage = document.getElementById('success-message');
    const successText = document.getElementById('success-text');
    
    // 隐藏消息
    errorMessage.classList.add('hidden');
    successMessage.classList.add('hidden');
    
    const fullName = document.getElementById('full_name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    // 验证密码
    if (password !== confirmPassword) {
        errorText.textContent = '两次输入的密码不一致';
        errorMessage.classList.remove('hidden');
        return;
    }
    
    // 密码强度验证
    if (password.length < 8) {
        errorText.textContent = '密码长度至少8位';
        errorMessage.classList.remove('hidden');
        return;
    }
    
    // 禁用按钮
    submitBtn.disabled = true;
    submitBtn.textContent = '注册中...';
    
    try {
        const response = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                email: email,
                password: password,
                full_name: fullName || null
            }),
        });
        
        const data = await response.json();
        
        if (response.ok) {
            successText.textContent = '注册成功！即将跳转到登录页面...';
            successMessage.classList.remove('hidden');
            
            // 3秒后跳转到登录页
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        } else {
            errorText.textContent = data.detail || '注册失败，请稍后重试';
            errorMessage.classList.remove('hidden');
        }
    } catch (error) {
        errorText.textContent = '网络错误，请稍后重试';
        errorMessage.classList.remove('hidden');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '注册';
    }
});
</script>
{% endblock %}{% endraw %}
