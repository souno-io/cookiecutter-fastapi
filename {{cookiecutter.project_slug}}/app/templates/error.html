{% raw %}{% extends "base.html" %}

{% block title %}Error {{ status_code }} - {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-96">
    <div class="text-center">
        <h1 class="text-9xl font-bold text-gray-200">{{ status_code }}</h1>
        <h2 class="text-2xl font-semibold text-gray-800 mt-4">{{ title }}</h2>
        <p class="text-gray-600 mt-2">{{ message }}</p>
        <a href="/" class="inline-block mt-6 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
            Go Home
        </a>
    </div>
</div>
{% endblock %}{% endraw %}
